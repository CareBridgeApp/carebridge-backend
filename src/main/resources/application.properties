spring.application.name=carebridge
spring.mongodb.uri=${MONGO_DB_URI}
spring.mongodb.database=CareBridgedb
logging.level.org.springframework.security=DEBUG
jwt.secret=${JWT_SECRET}
server.address=0.0.0.0
server.port=${PORT:8080}

#Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=always

#Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.7

#Embedding model
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# MongoDB Atlas Vector Store
spring.ai.vectorstore.mongodb.initialize-schema=false
spring.ai.vectorstore.mongodb.collection-name=medical_record_vectors
spring.ai.vectorstore.mongodb.index-name=medical_record_vector_index
spring.ai.vectorstore.mongodb.path-name=embedding

# Mercury Decide model configuration
mercury.api-url=https://openrouter.ai/api/alpha/decisions
mercury.api-key=${OPENROUTER_API_KEY}
mercury.model=inception/mercury-decide
